[package]
name = "closofcode-ide"
version = "0.1.0"
description = "ClosofCode IDE — a desktop code editor with opencode's theme and UI"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "closofcode_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
portable-pty = "0.8"
